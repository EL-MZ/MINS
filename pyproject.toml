[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mins"
version = "0.1.0.dev0"
description = "Experimental Morph-assisted nested importance sampling"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "MINS contributors" },
]
keywords = [
  "Bayesian inference",
  "evidence",
  "nested sampling",
  "importance sampling",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
morph = [
  "morphZ>=0.4.1.dev2",
]
plot = [
  "matplotlib>=3.7",
]
dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "morphZ>=0.4.1.dev2",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Documentation = "https://github.com/ApokryphaV1/MINS/tree/main/docs"
Issues = "https://github.com/ApokryphaV1/MINS/issues"
Repository = "https://github.com/ApokryphaV1/MINS"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "unit: deterministic unit tests",
  "integration: package and component integration tests",
  "statistical: stochastic accuracy tests",
  "slow: tests excluded from the fast development loop",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["MINS_PHASE_2_MORPH_NESTED_SAMPLING.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
packages = ["mins"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["morphZ", "morphZ.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["mins"]

[tool.coverage.report]
show_missing = true
skip_covered = true
